
services:
  # ==========================================
  # HQ CONTROLLER
  # ==========================================
  hq-controller:
    image: ubuntu:24.04
    container_name: hq-controller
    hostname: hq-controller
    environment:
      SSH_ROLE: controller
    ports:
      - "8080:8080"
  volumes:
      - ./cmdb-dashboard:/var/www/html
      - ./hosts.ini:/etc/ansible/hosts:ro
      - ./ssh/ssh-init.sh:/usr/local/bin/ssh-init.sh:ro
      - ./scripts/run-playbooks.sh:/usr/local/bin/run-playbooks.sh:ro
      - ./playbooks:/opt/fipo/playbooks
      - ssh_exchange:/ssh-exchange
    command: >
      sh -c "apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y
      ansible
      nginx
      openssh-server
      openssh-client
      sshpass
      python3 &&
      sed -i 's/listen 80 default_server;/listen 8080 default_server;/' /etc/nginx/sites-available/default &&
      sed -i 's/listen \[::\]:80 default_server;/listen [::]:8080 default_server;/' /etc/nginx/sites-available/default &&
      nginx &&
      exec /bin/sh /usr/local/bin/ssh-init.sh"
    networks:
      mgmt_net:
        ipv4_address: 172.30.10.10
      corp_net:
        ipv4_address: 172.30.20.5
      dmz_iot:
        ipv4_address: 172.30.30.5
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ==========================================
  # BACKUP VAULT
  # ==========================================
  backup-vault:
    image: debian:12
    container_name: backup-vault
    hostname: backup-vault
    environment:
      SSH_ROLE: worker
    volumes:
      - backup_data:/backups
      - ./ssh/ssh-init.sh:/usr/local/bin/ssh-init.sh:ro
      - ssh_exchange:/ssh-exchange
    command: >
      sh -c "apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y
      openssh-server
      openssh-client
      rsync
      gpg
      borgbackup
      python3 &&
      exec /bin/sh /usr/local/bin/ssh-init.sh"
    networks:
      mgmt_net:
        ipv4_address: 172.30.10.20

  # ==========================================
  # WORKSTATION - DEVELOPMENT
  # ==========================================
  ws-dev-01:
    image: ubuntu:24.04
    container_name: ws-dev-01
    hostname: ws-dev-01
    environment:
      SSH_ROLE: worker
    volumes:
      - ./ssh/ssh-init.sh:/usr/local/bin/ssh-init.sh:ro
      - ssh_exchange:/ssh-exchange
    command: >
      sh -c "apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y
      openssh-server
      openssh-client
      sudo
      git
      python3
      vim
      htop &&
      exec /bin/sh /usr/local/bin/ssh-init.sh"
    networks:
      corp_net:
        ipv4_address: 172.30.20.10

  # ==========================================
  # WORKSTATION - FINANCE
  # ==========================================
  ws-fin-01:
    image: ubuntu:24.04
    container_name: ws-fin-01
    hostname: ws-fin-01
    environment:
      SSH_ROLE: worker
    volumes:
      - ./ssh/ssh-init.sh:/usr/local/bin/ssh-init.sh:ro
      - ssh_exchange:/ssh-exchange
    command: >
      sh -c "apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y
      openssh-server
      openssh-client
      sudo
      python3 &&
      exec /bin/sh /usr/local/bin/ssh-init.sh"
    networks:
      corp_net:
        ipv4_address: 172.30.20.11

  # ==========================================
  # APPLICATION SERVER
  # ==========================================
  srv-app-01:
    image: rockylinux:9
    container_name: srv-app-01
    hostname: srv-app-01
    environment:
      SSH_ROLE: worker
    volumes:
      - ./ssh/ssh-init.sh:/usr/local/bin/ssh-init.sh:ro
      - ssh_exchange:/ssh-exchange
    command: >
      sh -c "dnf install -y
      openssh-server
      openssh-clients
      sudo
      python3 &&
      mkdir -p /var/run/sshd &&
      exec /bin/sh /usr/local/bin/ssh-init.sh"
    networks:
      corp_net:
        ipv4_address: 172.30.20.20

  # ==========================================
  # LOBBY KIOSK
  # ==========================================
  kiosk-lobby:
    image: debian:12
    container_name: kiosk-lobby
    hostname: kiosk-lobby
    environment:
      SSH_ROLE: worker
    volumes:
      - ./ssh/ssh-init.sh:/usr/local/bin/ssh-init.sh:ro
      - ssh_exchange:/ssh-exchange
    command: >
      sh -c "apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y
      openssh-server
      openssh-client
      python3 &&
      id kioskuser >/dev/null 2>&1 || useradd -m -s /bin/bash kioskuser;
      mkdir -p /var/run/sshd;
      exec /bin/sh /usr/local/bin/ssh-init.sh"
    networks:
      dmz_iot:
        ipv4_address: 172.30.30.10

  # ==========================================
  # IOT SENSOR
  # ==========================================
  iot-sensor-1:
    image: alpine:latest
    container_name: iot-sensor-1
    hostname: iot-sensor-1
    environment:
      SSH_ROLE: worker
    volumes:
      - ./ssh/ssh-init.sh:/usr/local/bin/ssh-init.sh:ro
      - ssh_exchange:/ssh-exchange
    command: >
      sh -c "apk add --no-cache openssh python3 &&
      mkdir -p /var/run/sshd &&
      exec /bin/sh /usr/local/bin/ssh-init.sh"
    networks:
      dmz_iot:
        ipv4_address: 172.30.30.20

  # ==========================================
  # IOT CAMERA
  # ==========================================
  iot-cam-1:
    image: debian:bookworm-slim
    container_name: iot-cam-1
    hostname: iot-cam-1
    environment:
      SSH_ROLE: worker
    volumes:
      - ./ssh/ssh-init.sh:/usr/local/bin/ssh-init.sh:ro
      - ssh_exchange:/ssh-exchange
    command: >
      sh -c "apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y
      openssh-server
      openssh-client
      python3 &&
      exec /bin/sh /usr/local/bin/ssh-init.sh"
    networks:
      dmz_iot:
        ipv4_address: 172.30.30.21

# ==========================================
# NETWORKS
# ==========================================
networks:
  mgmt_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24

  corp_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.20.0/24

  dmz_iot:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.30.0/24

# ==========================================
# VOLUMES
# ==========================================
volumes:
  backup_data:
  ssh_exchange:

